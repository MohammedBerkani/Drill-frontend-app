<div class="container">
  <a [routerLink]="['/home']" class="icon">home <i class="fa-solid fa-house"></i></a>
  <div class="wrapper">
    <h2>Manager</h2>
    <form [formGroup]="adminForm" (ngSubmit)="onSubmit()">
      <div class="input-box">
        <input
          type="text"
          placeholder="Enter Your Email"
          formControlName="email"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['required']"
      >
        Enter your email.
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['pattern']"
      >
        Enter valid email.
      </div>
      <div class="input-box">
        <input
          type="password"
          formControlName="password"
          placeholder="Enter Your Password"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['password'].errors?.['required']"
      >
        password is required.
      </div>
      <div class="input-box button">
        <input type="Submit" value="Log In" />
        <p *ngIf="showError">
          You can't make changes or go back at this time.!
        </p>
      </div>
      <span class="haveAccount">I don't have <a [routerLink]="['/adminReg']">account</a></span>
    </form>
  </div>
</div>
