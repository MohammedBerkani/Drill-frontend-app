<div class="container"*ngIf="SupAdmin?.length == 0; else show">
  <div class="wrapper">
    <h2> Admin Register</h2>
    <form [formGroup]="supAdminForm" (ngSubmit)="onSubmit()"  >
      <div class="input-box">
        <input
          type="text"
          formControlName="name"
          placeholder="Enter Your Name"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['name'].errors?.['required']"
      >
        Name is required.
      </div>
      <div class="input-box">
        <input
          type="email"
          formControlName="email"
          placeholder="Enter Your Email"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['required']"
      >
        Enter your email.
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['pattern']"
      >
        Enter valid email.
      </div>
      <div class="input-box">
        <input
          type="password"
          formControlName="password"
          placeholder="Enter Your Password"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['password'].errors?.['required']"
      >
        password is required.
      </div>
      <div class="input-box button">
        <input type="Submit" value="Submit" />
      </div>
    </form>
  
  </div>
</div>
<ng-template #show>
  <app-sup-admin-login></app-sup-admin-login>
</ng-template>
