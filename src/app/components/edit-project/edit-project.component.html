<div class="row justify-content-center">
    <div class="col-md-4 register-employee">
      <!-- form card register -->
      <div class="card-body">
        <form [formGroup]="ProjectForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="inputNumber">Number</label>
            <input class="form-control" type="text" formControlName="number" />
            <!-- error -->
          
          </div>
          <div class="form-group">
            <label for="input">Determined Time</label>
            <input class="form-control" type="text" formControlName="determinedTime" />
            <!-- error -->
           </div>
           <h3>Essential Informations</h3>
<div formGroupName="basic_info">
    <label for="input">contractor</label>
    <input class="form-control" type="text" formControlName="contractor" />
   <!-- error -->
   <br>
 <label for="input">Cellar Depth</label>
    <input class="form-control" type="number" formControlName="cellarDepth" /><br>
   <!-- error -->
   <label for="input">Well Profile</label>
    <input class="form-control" type="text" formControlName="wellProfile" /><br>
   <!-- error -->

   <input class="form-control" type="text" formControlName="targetReservoir" />
  <!-- error -->
  <br>

  <input class="form-control" type="text" formControlName="targetFormation" />
 <!-- error -->
 <br>

<!-- error -->
<br>
<label for="input">Td Formation Depth</label>
<input class="form-control" type="text" formControlName="TdFormationDepth" />
<!-- error -->
<br>

   

 
 <div formGroupName="surfaceCordinate">
    <label for="input">Type</label>
    <input class="form-control" type="text" formControlName="Type" />

   </div>
  
</div>


            <div class="form-group">
            <button class="btn btn-success btn-lg btn-block" type="submit">
              Update
            </button>
          </div>
        </form>
      </div>
    </div>
    <!-- form card register -->
  </div>
  <div><h3> Supervising Monitor</h3>
    
    <div *ngFor="let project of project"> 
      
    <div *ngIf="project.supervised == true ">
      <p *ngFor="let pr of OneDriller">   
        this project is supervised by {{pr.name}} <br>
        <app-button (btnclick)="Dismiss(pr)" text="Dismiss" ></app-button> 
  
      </p> 
           </div>
    </div>
    <table class="table table-bordered">
      <thead class="table-success">
        <tr>
          <th scope="col">DrillEngineer Name</th>
          <th scope="col">Email</th>
         </tr>
      </thead>
      <tbody>
        <tr *ngFor="let driller of DrillSupervisors "  >
          <td>{{driller.name}}</td>         
          <td>{{driller.email}}</td>
      <td>    <app-button (btnclick)="Assign(driller)" text="Assign"></app-button>
      </td>  </tr>
        
      </tbody>
    </table>

  </div>
