<div class="container">
  <a [routerLink]="['/home']" class="icon">home <i class="fa-solid fa-house"></i></a>
  <div class="wrapper">
    <h2> manager</h2>
    <form [formGroup]="adminForm" (ngSubmit)="onSubmit()">
      <div class="input-box">
        <input
          type="text"
          formControlName="name"
          placeholder="Enter Your Name"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['name'].errors?.['required']"
      >
        Name is required.
      </div>
      <div class="input-box">
        <input
          type="email"
          formControlName="email"
          placeholder="Enter Your Email"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['required']"
      >
        Enter your email.
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['email'].errors?.['pattern']"
      >
        Enter valid email.
      </div>
      <div class="input-box">
        <input
          type="password"
          formControlName="password"
          placeholder="Enter Your Password"
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="submitted && myForm['password'].errors?.['required']"
      >
        password is required.
      </div>
      <div class="input-box button">
        <input type="Submit" value="Register" />
      </div>
      <span class="haveAccount">I have <a [routerLink]="['/adminlog']">account</a></span>
    </form>
  </div>
</div>
